# Three single 50 MHz blocks. Block 0 stacks three waveforms in frequency
# (FM radio + walkie-talkie FM + OFDM) with 5 MHz guards; block 1 is a ~48 MHz
# 5G carrier; block 2 a single-carrier QPSK. Powers vary per waveform.
name: example_mixed
output_dir: composites
zc_file: ../generated_sync_sequences/ZadoffChu_bw50MHz_R25_N601.mat
library_root: ../generated_waveforms_24576
ref_rms: 0.15
peak_normalize: 0.95
blocks:
  - slots: [0]
    waveforms:
      - {mat: "Broadband_FM/Broadband_FM_dev1MHz_occ2p03MHz_lpf15kHz_mp3.mat", power_db: 0}
      - {mat: "Narrowband_FM/Narrowband_FM_dev5kHz_occ16kHz_lpf3kHz_mp3.mat", power_db: -3}
      - {mat: "OFDM/OFDM_bwidx4_occ9MHz_fft1024_mod16_cr1_2_pn9.mat", power_db: -6}
  - slots: [1]
    waveforms:
      - {mat: "5G_Downlink/5G_Downlink_bw50MHz_scs30kHz_pdsch16QAM_pn9.mat", power_db: -3}
  - slots: [2]
    waveforms:
      - {mat: "QPSK/QPSK_Rs15p36MHz_fosf4_occ18p432MHz_phase0_gray_rrc_a0p20_pn9.mat", power_db: 0}
