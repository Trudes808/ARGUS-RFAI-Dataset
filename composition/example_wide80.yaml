# An 80 MHz 802.11ax waveform spanning two merged blocks (slots 1+2), plus a
# narrow stacked block (BPSK + Bluetooth) in slot 0.
name: example_wide80
output_dir: composites
zc_file: ../generated_sync_sequences/ZadoffChu_bw50MHz_R25_N601.mat
library_root: ../generated_waveforms_24576
ref_rms: 0.15
peak_normalize: 0.95
blocks:
  - slots: [0]
    waveforms:
      - {mat: "BPSK/BPSK_Rs3p84MHz_fosf4_occ4p608MHz_phase0_gray_rrc_a0p20_pn9.mat", power_db: 0}
      - {mat: "Bluetooth/Bluetooth_le1m_sps8_pn9.mat", power_db: -3}
  - slots: [1, 2]
    waveforms:
      - {mat: "802_11ax/802_11ax_bw80MHz_mcs4_gi3p2us_heltf4_pn9.mat", power_db: -6}
