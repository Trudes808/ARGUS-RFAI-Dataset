# Two TIME GROUPS separated by a 25 ms guard. Group 1 frequency-multiplexes
# three blocks (a stacked block + two singles); group 2 has a 98 MHz 5G carrier
# (2 merged slots) plus an OFDM block. Demonstrates time + frequency multiplexing.
name: example_timegroups
output_dir: composites
zc_file: ../generated_sync_sequences/ZadoffChu_bw50MHz_R25_N601.mat
library_root: ../generated_waveforms_24576
guard_time_ms: 25
ref_rms: 0.15
peak_normalize: 0.95
time_groups:
  - blocks:
      - slots: [0]
        waveforms:
          - {mat: "BPSK/BPSK_Rs3p84MHz_fosf4_occ4p608MHz_phase0_gray_rrc_a0p20_pn9.mat", power_db: 0}
          - {mat: "Bluetooth/Bluetooth_le1m_sps8_pn9.mat", power_db: -3}
      - slots: [1]
        waveforms:
          - {mat: "5G_Downlink/5G_Downlink_bw20MHz_scs30kHz_pdschQPSK_pn9.mat", power_db: -6}
      - slots: [2]
        waveforms:
          - {mat: "QPSK/QPSK_Rs15p36MHz_fosf4_occ18p432MHz_phase0_gray_rrc_a0p20_pn9.mat", power_db: 0}
  - blocks:
      - slots: [0, 1]
        waveforms:
          - {mat: "5G_Downlink/5G_Downlink_bw100MHz_scs30kHz_pdschQPSK_pn9.mat", power_db: -3}
      - slots: [2]
        waveforms:
          - {mat: "OFDM/OFDM_bwidx4_occ9MHz_fft1024_mod16_cr1_2_pn9.mat", power_db: 0}
