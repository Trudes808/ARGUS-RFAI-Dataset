  # LTE and NR at 15 kHz subcarrier spacing share the same cyclic-prefix structure (4.69 us normal CP, 1 ms
  # subframes, 10 ms frames) and cannot be told apart without decoding; the TDD mid-bands are NR at 30 kHz.
  - id: cell_600_dl
    source: "3GPP TS 36.101 Table 5.5-1 (band 71 DL 617-652 MHz); TS 38.101-1 (n71, 15 kHz SCS, 5/10/15/20 MHz carriers); TS 36.211 / 38.211 (OFDM numerology: 15 kHz, Tu 66.67 us, normal CP 4.69 us / 5.21 us first symbol, 1 ms subframes, 10 ms frames); 47 CFR 27 Subpart N"
    descriptor:
      modulation: [ofdm]
      envelope: gaussian
      ofdm: {scs_hz: [15.0e3], cp_s: [4.69e-6, 5.21e-6]}
      spectral: {carrier_line: false, rolloff: steep}
      timing: {period_s: [{value: 1.0e-3, tol: 0.02, note: subframe}, {value: 10.0e-3, tol: 0.02, note: frame}], duty: {min: 0.95, max: 1.0}}
