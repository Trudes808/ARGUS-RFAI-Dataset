# LUT library, USA: physical-layer descriptors of the common over-the-air waveforms
# ==================================================================================
# A descriptor layer on top of common_ota_waveforms_manifest_usa.yaml (which keeps the bands, rasters, box
# widths, temporal classes and sweep plans). manifest_io.load_library() merges the two: an entry here with an
# `id` that exists in the manifest adds its `descriptor`, `variants`, `synth` and `source` to that entry (and
# may override manifest fields); an entry with `new: true` is defined here in full. The merged library is what
# lut_classify.py matches against and what synth_lut_scenes.py generates from.
#
# The descriptor is the comms analogue of an ELINT emitter record: the parameters of the standard that a
# receiver can measure from the IQ of one emission without decoding it. Every value comes from the open
# standard named in `source`; where a value is a deployment convention rather than a standard it says so.
#
# Descriptor fields (all optional; a field that is absent is simply not tested):
#   modulation        list of classes the emission may show. Vocabulary (what measure_descriptors.py can tell apart):
#                       fm    analogue frequency modulation (WFM/NBFM; constant envelope, continuous instantaneous frequency)
#                       am    amplitude modulation with carrier (AM voice, VOR, OOK readers)        ssb  suppressed carrier
#                       fsk   the frequency-shift family: 2/4-FSK, GFSK, CPFSK, MSK, GMSK (constant envelope, discrete
#                             instantaneous-frequency levels, symbol-rate line in the frequency transitions)
#                       psk   linear single carrier: PSK/DPSK/QAM/DSSS chips (symbol-rate line in |y|^2)
#                       ofdm  cyclic-prefix multicarrier (OFDM/OFDMA/SC-FDMA; CP autocorrelation peak at Tu)
#                       vsb   8-VSB (pilot at the lower edge + symbol-rate line)
#                       css   chirp spread spectrum (LoRa; linear instantaneous-frequency ramps)
#                       pulse pulsed / on-off keyed: PPM, radar, OOK remotes (envelope is the information)
#                       cw    a bare carrier or spur            noise  noise-like / spread below the floor
#   envelope          constant | linear | gaussian | pulsed | am    amplitude statistics expected inside a burst
#   symbol_rate_hz    [{value, tol, note}]  symbol or chip rates (relative tol, default 0.02). The matcher derives
#                     where the rate shows up from the modulation class (|y|^2 line for psk/vsb/pulse, frequency-
#                     transition line for fsk, y^2 line spacing 2*h*Rs for fsk with mod_index) and allows aliasing.
#   mod_index         [h values] for the fsk family (2 * peak deviation / symbol rate)
#   deviation_hz      {peak_min, peak_max}  peak instantaneous-frequency deviation (fm/fsk)
#   ofdm              {scs_hz: [..], cp_s: [..], note}  subcarrier spacings (Tu = 1/scs) and cyclic prefixes
#   chirp             [{bw_hz, sf: [..]}] LoRa-style chirps: slope = bw^2 / 2^sf Hz/s, symbol 2^sf / bw s
#   timing            pulse_s {min,max}  fine-scale pulse width (0.25 us smoothing, 2 us merge gap)
#                     burst_s {min,max}  coarse-scale burst length (5 us smoothing, 100 us merge gap); default = manifest burst_s
#                     pri_s   [{value|min/max, tol, note}]  start-to-start intervals (either scale); harmonics accepted
#                     gap_s   [{value, tol, note}]  end-to-start gaps between consecutive bursts (SIFS, T_IFS, turnaround)
#                     period_s [{value, tol, note}] frame / beacon / scan periods from the envelope autocorrelation
#                     pulse_pair_s [{value, tol}]   DME-style pulse pairs
#                     duty {min,max}
#   spectral          carrier_line true|false   a discrete line at the carrier (AM, OOK, pilots)
#                     fm_tones_hz [..]   tones expected in the FM-demodulated baseband (19 kHz pilot, 57 kHz RDS, 1200/2200 AFSK)
#                     am_tones_hz [..]   tones expected in the AM envelope (VOR 30/9960 Hz, ACARS 1200/2400, WWV 100/1000)
#                     hd_sidebands {offset_hz: [lo, hi], scs_hz, cp_s}   NRSC-5 digital sidebands beside an analogue carrier
#                     rolloff steep|smooth
#   hop               {rate_hz, dwell_s, channels, spacing_hz, set_hz: [..]}  band-level hopping statistics
#   weights           {field: w} evidence weights (defaults: symbol_rate 3, ofdm 3, chirp 3, pri 2, period 2, gap 2,
#                     pulse 2, pulse_pair 3, modulation 2, deviation 1, fm_tones 3, am_tones 2, carrier_line 1, hop 2)
#   requires_descriptors  minimum number of verified descriptor fields before a label is emitted (default 1 for
#                     shared bands, 0 for band_exclusive entries)
#   requires_fields   descriptor fields that must be verified before this entry is labelled (e.g. [pulse_pair] for DME)
# variants            [{id, suffix, descriptor}] sub-types of one entry (P25 vs DMR vs analogue voice, LTE vs NR,
#                     DSSS vs OFDM Wi-Fi). When exactly one variant is verified the label becomes ~<label>/<suffix>.
# synth               generator recipe for synth_lut_scenes.py (kind + parameters not implied by the descriptor).
# source              the standard(s) the numbers come from.

schema_version: 1
name: "lut_library_usa"
extends: common_ota_waveforms_manifest_usa.yaml
updated: 2026-11-10

entries:

  # ------------------------------------------------------------------ receiver artefacts ------------
  - id: receiver_dc_spur
    source: "receiver (LO leakage / DC offset of a direct-conversion front end)"
    descriptor:
      modulation: [cw, fm]                 # a line with the receiver's phase noise measures as cw or narrow fm
      envelope: constant
      spectral: {carrier_line: true}

  - id: receiver_spur_comb
    source: "receiver (reference-clock harmonics)"
    descriptor:
      modulation: [cw, fm]
      envelope: constant
      spectral: {carrier_line: true}

  # ------------------------------------------------------------------ broadcast -----------------------
  - id: fm_broadcast
    source: "47 CFR 73.310/73.317/73.322 (200 kHz channels, +-75 kHz deviation, 19 kHz pilot, 57 kHz RDS subcarrier); NRSC-4 (RBDS); NRSC-5-D (HD Radio IBOC)"
    descriptor:
      modulation: [fm]
      envelope: constant
      deviation_hz: {peak_min: 20.0e3, peak_max: 90.0e3}      # +-75 kHz programme peaks; measured p99 of |f_inst|
      spectral:
        fm_tones_hz: [19.0e3]                                   # stereo pilot (every stereo station; RDS at 57 kHz is suppressed-carrier, a hump not a line)
        hd_sidebands: {offset_hz: [129.4e3, 198.4e3], scs_hz: 363.37, cp_s: 0.15e-3, note: "NRSC-5 hybrid MP1: OFDM, 2.902 ms symbols (Tu 2.752 ms)"}
        rolloff: smooth
      timing: {duty: {min: 0.98, max: 1.0}}
    variants:
      - {id: analog, suffix: analog, descriptor: {spectral: {fm_tones_hz: [19.0e3]}}}
      - {id: hd_hybrid, suffix: HD, descriptor: {spectral: {hd_sidebands: {offset_hz: [129.4e3, 198.4e3], scs_hz: 363.37, cp_s: 0.15e-3}}}}
    synth: {kind: fm_stereo, audio_bw_hz: 15.0e3, pilot: true, rds: true, hd_prob: 0.4}

  - id: noaa_weather_radio
    source: "NWS NWR specification (7 channels 162.400-162.550 MHz, NBFM +-5 kHz, synthesized voice; 1050 Hz WAT tone; SAME AFSK 520.83 bps, mark 2083.3 Hz / space 1562.5 Hz, NWSI 10-1712)"
    descriptor:
      modulation: [fm]
      envelope: constant
      deviation_hz: {peak_min: 2.0e3, peak_max: 6.0e3}
      spectral: {rolloff: smooth, fm_tones_hz: []}
      timing: {duty: {min: 0.98, max: 1.0}}
    synth: {kind: nbfm_voice, audio_bw_hz: 3.0e3, deviation_hz: 5.0e3, continuous: true}

  - id: atsc_tv_uhf
    source: "ATSC A/53 Part 2 (8-VSB, symbol rate 10.762238 Msym/s = 4.5 MHz x 684/286, pilot at lower edge + 309.441 kHz, RRC roll-off 0.0575, segment 832 symbols = 77.3 us, field 313 segments = 24.2 ms)"
    descriptor:
      modulation: [vsb]
      envelope: linear
      symbol_rate_hz: [{value: 10.762238e6, tol: 0.005, note: 8-VSB symbol rate}, {value: 12935.4, tol: 0.01, note: data-segment rate (832 symbols) line in |y|^2}]
      spectral: {carrier_line: true, rolloff: steep}
      timing:
        period_s: [{value: 77.306e-6, tol: 0.01, note: data segment}, {value: 24.197e-3, tol: 0.01, note: data field}]
        duty: {min: 0.98, max: 1.0}
    synth: {kind: vsb8}

  - id: atsc_tv_vhf_high
    source: "ATSC A/53 Part 2 (as atsc_tv_uhf)"
    descriptor:
      modulation: [vsb]
      envelope: linear
      symbol_rate_hz: [{value: 10.762238e6, tol: 0.005}, {value: 12935.4, tol: 0.01, note: data-segment rate line}]
      spectral: {carrier_line: true, rolloff: steep}
      timing: {period_s: [{value: 77.306e-6, tol: 0.01}, {value: 24.197e-3, tol: 0.01}], duty: {min: 0.98, max: 1.0}}
    synth: {kind: vsb8}

  - id: atsc_tv_vhf_low
    source: "ATSC A/53 Part 2 (as atsc_tv_uhf)"
    descriptor:
      modulation: [vsb]
      envelope: linear
      symbol_rate_hz: [{value: 10.762238e6, tol: 0.005}, {value: 12935.4, tol: 0.01, note: data-segment rate line}]
      spectral: {carrier_line: true, rolloff: steep}
      timing: {period_s: [{value: 77.306e-6, tol: 0.01}, {value: 24.197e-3, tol: 0.01}], duty: {min: 0.98, max: 1.0}}
    synth: {kind: vsb8}

  - id: atsc3_tv
    new: true
    label: ATSC3_TV
    name: "ATSC 3.0 (NextGen TV) OFDM in a 6 MHz TV channel"
    service: broadcast
    tier: B
    freq_ranges_hz: [[54.0e6, 72.0e6], [76.0e6, 88.0e6], [174.0e6, 216.0e6], [470.0e6, 608.0e6]]
    raster: {spacing_hz: 6.0e6, offset_hz: 473.0e6}
    bandwidth_hz: {min: 5.5e6, nominal: 5.83e6, max: 6.1e6}
    temporal: continuous
    iq_signature: flat_top
    band_exclusive: true
    requires: [bandwidth, temporal]
    requires_descriptors: 1
    source: "ATSC A/322 (physical layer: 6.912 MHz sampling, FFT 8K/16K/32K -> subcarrier spacing 843.75 / 421.875 / 210.9375 Hz, guard intervals 192..3648 samples = 27.8..527.8 us); ATSC A/321 (bootstrap: 4 symbols of 500 us at 4.5 MHz bandwidth at every frame start, frames 50..250 ms)"
    descriptor:
      modulation: [ofdm]
      envelope: gaussian
      ofdm: {scs_hz: [843.75, 421.875, 210.9375], cp_s: [27.8e-6, 55.6e-6, 83.3e-6, 111.1e-6, 166.7e-6, 222.2e-6, 277.8e-6, 333.3e-6, 388.9e-6, 444.4e-6, 527.8e-6]}
      spectral: {carrier_line: false, rolloff: steep}
      timing: {period_s: [{min: 50.0e-3, max: 250.0e-3, note: frame length (bootstrap every frame)}], duty: {min: 0.98, max: 1.0}}
    sweep: {default: false, antenna_group: low, centers_hz: [530.0e6], rates_hz: [50.0e6]}
    synth: {kind: ofdm_continuous, scs_hz: 843.75, cp_s: 222.2e-6, bw_hz: 5.83e6}

  - id: am_broadcast
    source: "47 CFR 73.44 (10 kHz channels 540-1700 kHz, +-10.2 kHz occupied); NRSC-5-D (HD AM MA1: digital sidebands +-(5..15) kHz, 181.7 Hz subcarrier spacing)"
    descriptor:
      modulation: [am]
      envelope: am
      spectral: {carrier_line: true, rolloff: smooth}
      timing: {duty: {min: 0.98, max: 1.0}}
    synth: {kind: am_voice, audio_bw_hz: 5.0e3, mod_depth: 0.6}

  - id: wwv_time_signal
    source: "NIST SP 432 (WWV/WWVH: AM carriers 2.5/5/10/15/20 MHz, 100 Hz BCD subcarrier, 440/500/600 Hz tones, 1000 Hz (WWV) / 1200 Hz (WWVH) second ticks of 5 ms, voice announcements)"
    descriptor:
      modulation: [am]
      envelope: am
      spectral: {carrier_line: true, am_tones_hz: [100.0, 500.0, 600.0, 1000.0, 1200.0]}
      timing: {period_s: [{value: 1.0, tol: 0.01, note: second ticks}], duty: {min: 0.98, max: 1.0}}
    synth: {kind: am_tones, tones_hz: [100.0, 500.0, 1000.0], tick: true}

  - id: shortwave_broadcast_hf
    new: true
    label: Shortwave_AM_broadcast
    name: "International HF broadcasting (AM, 5 kHz channels in the ITU HF broadcast bands)"
    service: broadcast
    tier: B
    freq_ranges_hz: [[5.9e6, 6.2e6], [7.2e6, 7.45e6], [9.4e6, 9.9e6], [11.6e6, 12.1e6], [13.57e6, 13.87e6], [15.1e6, 15.8e6], [17.48e6, 17.9e6], [21.45e6, 21.85e6]]
    raster: {spacing_hz: 5.0e3, offset_hz: 0.0}
    bandwidth_hz: {min: 6.0e3, nominal: 9.0e3, max: 11.0e3}
    temporal: continuous
    iq_signature: peaked
    band_exclusive: false
    requires: [bandwidth, temporal]
    requires_descriptors: 1
    source: "ITU Radio Regulations Art. 5 (HF broadcasting bands); ITU-R BS.640 (AM, 5 kHz spacing)"
    descriptor:
      modulation: [am]
      envelope: am
      spectral: {carrier_line: true, rolloff: smooth}
      timing: {duty: {min: 0.95, max: 1.0}}
    sweep: {default: false, antenna_group: low, centers_hz: [9.65e6, 15.45e6], rates_hz: [1.0e6]}
    synth: {kind: am_voice, audio_bw_hz: 4.5e3, mod_depth: 0.7}

  - id: cb_radio_27mhz
    source: "47 CFR 95 Subpart D (40 channels 26.965-27.405 MHz, 10 kHz spacing, AM 4 W / SSB 12 W PEP)"
    descriptor:
      modulation: [am, ssb]
      envelope: am
      spectral: {carrier_line: true, rolloff: smooth}
    synth: {kind: am_voice, audio_bw_hz: 3.0e3, mod_depth: 0.8, ptt: true}

  # ------------------------------------------------------------------ aviation -----------------------
  - id: vor_ils_nav
    source: "ICAO Annex 10 Vol I 3.3 (VOR: carrier AM 30 Hz variable phase + 9960 Hz subcarrier FM +-480 Hz by 30 Hz reference, 1020 Hz ident), 3.1 (ILS localizer 90/150 Hz AM, glide path 329.15-335 MHz); 47 CFR 87 (108-117.95 MHz, 50 kHz channels)"
    descriptor:
      modulation: [am]
      envelope: am
      spectral: {carrier_line: true, am_tones_hz: [30.0, 9960.0, 1020.0, 90.0, 150.0], rolloff: smooth}
      timing: {duty: {min: 0.98, max: 1.0}}
    variants:
      - {id: vor, suffix: VOR, descriptor: {spectral: {am_tones_hz: [30.0, 9960.0]}}}
      - {id: ils, suffix: ILS, descriptor: {spectral: {am_tones_hz: [90.0, 150.0]}}}
    synth: {kind: am_tones, tones_hz: [30.0, 9960.0, 1020.0], depth: [0.3, 0.3, 0.1]}

  - id: air_band_voice
    requires_descriptors: 0            # deliberately coarse catch-all: the band + timing label stands; descriptors add the variant
    source: "ICAO Annex 10 Vol III Part II Ch 2 (VHF AM DSB voice 118-136.975 MHz, 25 kHz channel spacing in the US, audio 300-2500 Hz); 47 CFR 87.173"
    descriptor:
      modulation: [am]
      envelope: am
      spectral: {carrier_line: true, rolloff: smooth}
      timing: {burst_s: {min: 0.3, max: 30.0}, duty: {min: 0.05, max: 1.0}}
    synth: {kind: am_voice, audio_bw_hz: 2.5e3, mod_depth: 0.85, ptt: true}

  - id: acars_vhf
    source: "ARINC 618 (ACARS: AM carrier with 2400 bps MSK, tones 1200/2400 Hz, message blocks up to 220 characters); US frequencies 129.125, 130.025, 130.450, 131.125, 131.550 MHz"
    descriptor:
      modulation: [am]
      envelope: am
      symbol_rate_hz: [{value: 2400.0, tol: 0.03, note: MSK on the AM envelope}]
      spectral: {carrier_line: true, am_tones_hz: [1200.0, 2400.0], rolloff: smooth}
      timing: {burst_s: {min: 0.08, max: 1.2}}
    synth: {kind: am_msk, bitrate: 2400.0, burst_s: [0.1, 0.8]}

  - id: vdl2_136975
    new: true
    label: VDL_Mode2
    name: "VHF Digital Link Mode 2 (ACARS over AVLC, D8PSK 31.5 kbps)"
    service: aviation
    tier: B
    freq_ranges_hz: [[136.6e6, 137.0e6]]
    channel_centers_hz: [136.975e6, 136.725e6, 136.775e6, 136.825e6, 136.875e6, 136.925e6]
    bandwidth_hz: {min: 12.0e3, nominal: 19.0e3, max: 25.0e3}
    temporal: bursty
    burst_s: {min: 3.0e-3, max: 300.0e-3}
    iq_signature: flat_top
    band_exclusive: false
    requires: [channels, bandwidth]
    requires_descriptors: 1
    source: "ICAO Annex 10 Vol III Part I Ch 6 (VDL Mode 2: D8PSK, 10.5 ksym/s = 31.5 kbps, raised-cosine alpha 0.6, 25 kHz channels, CSMA); RTCA DO-281"
    descriptor:
      modulation: [psk]
      envelope: linear
      symbol_rate_hz: [{value: 10.5e3, tol: 0.02}]
      spectral: {carrier_line: false, rolloff: smooth}
      timing: {burst_s: {min: 3.0e-3, max: 300.0e-3}}
    sweep: {default: false, antenna_group: low, centers_hz: [136.85e6], rates_hz: [1.0e6]}
    synth: {kind: psk_burst, order: 8, differential: true, symbol_rate_hz: 10.5e3, rolloff: 0.6, burst_s: [0.005, 0.1]}

  - id: ssr_adsb_1090
    source: "ICAO Annex 10 Vol IV Ch 3 (SSR replies at 1090 +-1 MHz: Mode A/C 0.45 us pulses on a 1.45 us grid in 20.3 us frames; Mode S PPM, 1 us chips of 0.5 us pulses, 8 us preamble + 56/112 bits = 64/120 us); RTCA DO-260B (1090ES ADS-B = DF17/18 112-bit squitters, 2 per second per aircraft)"
    descriptor:
      modulation: [pulse]
      envelope: pulsed
      symbol_rate_hz: [{value: 2.0e6, tol: 0.03, note: PPM pulse-position grid (0.5 us) line in |y|^2}]
      spectral: {rolloff: smooth}
      timing:
        pulse_s: {min: 0.3e-6, max: 0.75e-6}
        burst_s: {min: 15.0e-6, max: 130.0e-6}
        pri_s: [{value: 1.0e-6, tol: 0.05, note: chip}, {value: 0.5e-6, tol: 0.1, note: half chip}, {value: 1.45e-6, tol: 0.05, note: Mode A/C pulse grid}]
        duty: {min: 0.0, max: 0.2}
    variants:
      - {id: mode_s, suffix: ModeS, descriptor: {timing: {burst_s: {min: 55.0e-6, max: 130.0e-6}}}}
      - {id: mode_ac, suffix: ModeAC, descriptor: {timing: {burst_s: {min: 15.0e-6, max: 25.0e-6}, pri_s: [{value: 1.45e-6, tol: 0.05}]}}}
    synth: {kind: adsb_ppm, rate_per_s: [20, 300]}

  - id: ssr_interrogation_1030
    source: "ICAO Annex 10 Vol IV Ch 3 (interrogations at 1030 +-0.2 MHz: P1/P3 pulses 0.8 us, spacing 8 us (Mode A) / 21 us (Mode C) / 5 us (Mode S P1-P2); Mode S P6 16.25 or 30.25 us with DPSK at 4 Mbps)"
    descriptor:
      modulation: [pulse, psk]
      envelope: pulsed
      symbol_rate_hz: [{value: 4.0e6, tol: 0.03, note: DPSK inside P6}]
      timing:
        pulse_s: {min: 0.6e-6, max: 1.0e-6}
        burst_s: {min: 0.6e-6, max: 32.0e-6}
        pri_s: [{value: 8.0e-6, tol: 0.03, note: P1-P3 Mode A}, {value: 21.0e-6, tol: 0.03, note: P1-P3 Mode C}, {value: 2.0e-6, tol: 0.05, note: P1-P2}]
        duty: {min: 0.0, max: 0.05}
    synth: {kind: ssr_interrogation, rate_per_s: [50, 400]}

  - id: uat_978
    new: true
    label: UAT_ADS-B_978
    name: "Universal Access Transceiver (978 MHz ADS-B / TIS-B / FIS-B, CPFSK 1.041667 Mbps)"
    service: aviation
    tier: A
    freq_ranges_hz: [[977.0e6, 979.0e6]]
    channel_centers_hz: [978.0e6]
    bandwidth_hz: {min: 0.9e6, nominal: 1.3e6, max: 2.0e6}
    temporal: bursty
    burst_s: {min: 0.2e-3, max: 4.5e-3}
    iq_signature: peaked
    band_exclusive: true
    requires: [channels, bandwidth, burst]
    requires_descriptors: 1
    source: "RTCA DO-282B (UAT MOPS: 978 MHz, binary CPFSK, modulation index 0.6 (+-312.5 kHz), 1.041667 Mbps; ADS-B messages 36-bit sync + 240 (basic) or 384 (long) bits = 265 / 403 us; ground uplink 4416 bits = 4.24 ms in 32 slots of 5.5 ms during the first 188 ms of each UTC second); 14 CFR 91.225"
    descriptor:
      modulation: [fsk]
      envelope: constant
      mod_index: [0.6]
      symbol_rate_hz: [{value: 1.041667e6, tol: 0.02}]
      deviation_hz: {peak_min: 250.0e3, peak_max: 380.0e3}
      timing:
        burst_s: {min: 0.2e-3, max: 4.5e-3}
        period_s: [{value: 1.0, tol: 0.01, note: UTC second (ground uplinks)}, {value: 5.5e-3, tol: 0.02, note: ground uplink slots}]
    sweep: {default: true, antenna_group: low, centers_hz: [979.0e6], rates_hz: [10.0e6]}
    synth: {kind: fsk_burst, symbol_rate_hz: 1.041667e6, h: 0.6, bt: null, burst_bits: [276, 420, 4416], rate_per_s: [5, 60]}

  - id: dme_tacan
    requires_fields: [pulse_pair]         # shares 960-1215 MHz with UAT, SSR and TACAN: the 12 / 30 us pairs must be seen
    source: "ICAO Annex 10 Vol I 3.5 (DME: 962-1213 MHz, 1 MHz channels; Gaussian pulses 3.5 us half-amplitude width, pulse pairs spaced 12 us (X) or 30/36 us (Y); transponder output ~2700 pulse pairs/s including squitter; interrogators 5-150 pp/s); RTCA DO-189"
    descriptor:
      modulation: [pulse]
      envelope: pulsed
      spectral: {rolloff: smooth}
      timing:
        pulse_s: {min: 2.5e-6, max: 4.8e-6}
        burst_s: {min: 2.5e-6, max: 5.0e-6}
        pulse_pair_s: [{value: 12.0e-6, tol: 0.04}, {value: 30.0e-6, tol: 0.04}, {value: 36.0e-6, tol: 0.04}]
        pri_s: [{value: 12.0e-6, tol: 0.04, note: X pair}, {value: 30.0e-6, tol: 0.04, note: Y pair}, {value: 36.0e-6, tol: 0.04}]
        duty: {min: 0.0, max: 0.05}
    synth: {kind: dme_pairs, spacing_s: 12.0e-6, pairs_per_s: [100, 2700]}

  - id: radio_altimeter_4200
    new: true
    label: Radio_altimeter_4.3GHz
    name: "Aircraft radio altimeter (FMCW or pulsed, 4.2-4.4 GHz; only when an aircraft is overhead)"
    service: aviation
    tier: C
    freq_ranges_hz: [[4200.0e6, 4400.0e6]]
    bandwidth_hz: {min: 20.0e6, nominal: 100.0e6, max: 200.0e6}
    temporal: either
    burst_s: {min: 1.0e-3, max: 60.0}
